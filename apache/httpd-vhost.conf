# SIP Honeypot Apache Configuration
# Reverse proxy for Web UI and Provisioning Honeypot with HTTPS

ServerName ${SERVER_NAME}

# Listen on SSL port (port 80 already defined in httpd.conf)
Listen 443

# Redirect HTTP to HTTPS (for web UI only)
<VirtualHost *:80>
    ServerName ${SERVER_NAME}
    ServerAlias core0.snapcom.com core1-stl.snapcom.com core2-stl.snapcom.com provisioning.snapcom.com sip.snapcom.com

    # Provisioning honeypot - keep on HTTP (phones expect this)
    # Proxy provisioning requests to honeypot
    ProxyPreserveHost On
    ProxyPass /ndp http://honeypot:8080/ndp
    ProxyPassReverse /ndp http://honeypot:8080/ndp
    ProxyPass /portal http://honeypot:8080/portal
    ProxyPassReverse /portal http://honeypot:8080/portal

    # Polycom provisioning
    ProxyPassMatch "^/([0-9a-fA-F]{12}.*\.cfg)$" http://honeypot:8080/$1
    ProxyPassMatch "^/(sip\.cfg|phone[0-9]+\.cfg)$" http://honeypot:8080/$1
    ProxyPass /Config http://honeypot:8080/Config
    ProxyPassReverse /Config http://honeypot:8080/Config

    # Yealink provisioning
    ProxyPassMatch "^/(y[0-9a-fA-F]{12}\.cfg)$" http://honeypot:8080/$1
    ProxyPassMatch "^/([0-9a-fA-F]{12}\.boot)$" http://honeypot:8080/$1
    ProxyPass /Yealink http://honeypot:8080/Yealink
    ProxyPassReverse /Yealink http://honeypot:8080/Yealink

    # NetSapiens cfg provisioning (e.g., /cfg/44dbd2ab5806.cfg-text)
    ProxyPass /cfg/ http://honeypot:8080/cfg/
    ProxyPassReverse /cfg/ http://honeypot:8080/cfg/

    # Grandstream provisioning
    ProxyPassMatch "^/(cfg[0-9a-fA-F]{12}.*)$" http://honeypot:8080/$1
    ProxyPass /gs_config.txt http://honeypot:8080/gs_config.txt

    # Generic provisioning paths
    ProxyPass /prov http://honeypot:8080/prov
    ProxyPassReverse /prov http://honeypot:8080/prov
    ProxyPass /provisioning http://honeypot:8080/provisioning
    ProxyPassReverse /provisioning http://honeypot:8080/provisioning
    ProxyPass /config http://honeypot:8080/config
    ProxyPassReverse /config http://honeypot:8080/config

    # SiPbx honeypot (Snapcom impersonation)
    ProxyPass /SiPbx http://honeypot:8080/SiPbx
    ProxyPassReverse /SiPbx http://honeypot:8080/SiPbx

    # Everything else - redirect to HTTPS for web UI
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/ndp
    RewriteCond %{REQUEST_URI} !^/portal
    RewriteCond %{REQUEST_URI} !^/prov
    RewriteCond %{REQUEST_URI} !^/provisioning
    RewriteCond %{REQUEST_URI} !^/config
    RewriteCond %{REQUEST_URI} !^/Config
    RewriteCond %{REQUEST_URI} !^/Yealink
    RewriteCond %{REQUEST_URI} !^/SiPbx
    RewriteCond %{REQUEST_URI} !\.cfg$
    RewriteCond %{REQUEST_URI} !\.boot$
    RewriteCond %{REQUEST_URI} !^/cfg
    RewriteCond %{REQUEST_URI} !^/gs_config
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
</VirtualHost>

# HTTPS Virtual Host - Web UI
<VirtualHost *:443>
    ServerName ${SERVER_NAME}
    ServerAlias core0.snapcom.com core1-stl.snapcom.com core2-stl.snapcom.com provisioning.snapcom.com sip.snapcom.com

    # Allow encoded slashes in URLs (for IPv6 CIDR like /48)
    AllowEncodedSlashes NoDecode

    SSLEngine on
    SSLCertificateFile /usr/local/apache2/ssl/server.crt
    SSLCertificateKeyFile /usr/local/apache2/ssl/server.key

    # Modern SSL configuration
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder off

    # Security headers
    Header always set Strict-Transport-Security "max-age=63072000"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"

    # Proxy settings
    ProxyPreserveHost On
    ProxyTimeout 300

    # SiPbx honeypot (Snapcom impersonation) - must be before catch-all
    ProxyPass /SiPbx http://honeypot:8080/SiPbx
    ProxyPassReverse /SiPbx http://honeypot:8080/SiPbx

    # NetSapiens cfg provisioning (e.g., /cfg/44dbd2ab5806.cfg-text)
    ProxyPass /cfg/ http://honeypot:8080/cfg/
    ProxyPassReverse /cfg/ http://honeypot:8080/cfg/

    # API endpoints (nocanon preserves encoded characters like %2F for CIDR notation)
    ProxyPass /api http://honeypot:8081/api nocanon
    ProxyPassReverse /api http://honeypot:8081/api

    # Static files
    ProxyPass /static http://honeypot:8081/static
    ProxyPassReverse /static http://honeypot:8081/static

    # Frontend (everything else)
    ProxyPass / http://honeypot:8081/
    ProxyPassReverse / http://honeypot:8081/

    # WebSocket support (if needed later)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) "ws://honeypot:8081/$1" [P,L]

    # Logging
    ErrorLog /var/log/apache2/honeypot-error.log
    CustomLog /var/log/apache2/honeypot-access.log combined
</VirtualHost>
